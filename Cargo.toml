[package]
name = "ahess"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.4.11", features = ["derive"] }
gpui = "0.2.2"
unicode-segmentation = "1.12.0"
cpal = "0.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
csv = "1.3"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
